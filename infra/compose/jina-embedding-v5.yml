# Compose override for jina-embeddings-v5-text-small-retrieval Q8_0.
#
# llama.cpp downloads Q8_0 into the shared model cache, matching the Qwen
# embedding service pattern. The new vector table never overwrites Qwen data.
services:
  embedding-jina-v5:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: hkpl_embedding_jina_v5
    ports:
      - "8007:8080"
    volumes:
      - llama_cache:/root/.cache/llama.cpp
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "${JINA_EMBEDDING_GPU_ID:-0}"
    command: >
      -hf jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0
      --host 0.0.0.0
      --port 8080
      --embedding
      --pooling last
      --n-gpu-layers 99
      --ctx-size 8192
      --batch-size 1024
      --ubatch-size 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  langgraph-agent:
    environment:
      EMBEDDING_URL: http://embedding-jina-v5:8080/v1/embeddings
      EMBEDDING_TOKENIZER_URL: http://embedding-jina-v5:8080/tokenize
      EMBEDDING_TOKENIZER_NAME: llama.cpp:jina-embeddings-v5-small-retrieval-q8_0
      VECTOR_TABLE: "${JINA_EMBEDDING_VECTOR_TABLE:-hkpl_knowledge_hybrid_jina_v5}"
      EMBED_DIM: "1024"
    depends_on:
      embedding-jina-v5:
        condition: service_healthy
