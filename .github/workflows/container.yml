name: Container

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "infra/docker/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen
      - run: make check test

  agent-image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or publish agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}/agent:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
