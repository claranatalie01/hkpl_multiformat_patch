name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check repository
        run: make check
      - name: Run unit tests
        run: make test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create non-secret Compose environment
        run: |
          cp .env.example .env
      - name: Validate baseline Compose configuration
        run: docker compose config --quiet
