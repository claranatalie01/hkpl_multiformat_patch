name: CI

on:
  pull_request:
  push:
    branches:
      - RAG_ONLY
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check repository
        run: make check
      - name: Run unit tests
        run: make test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
